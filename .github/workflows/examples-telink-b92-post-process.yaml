name: Upload Telink example

on:
  workflow_run:
    workflows: ["Build and upload Telink example"]
    types:
      - completed

jobs:
  upload:
    name: Upload example
    runs-on: ubuntu-22.04
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: telink-examples,push
          path: /tmp/telink_build_artifacts

      - name: Debug file existence
        run: |
          ls -la "/tmp/telink_build_artifacts/"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

      - name: Debug Python environment
        run: |
          which python3 
          python3 --version
          ls -l $(which python)
          which pip3
          pip3 --version
